<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progreso</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
  <link href="../css/components.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-personalizada shadow-sm">
  <div class="container">

    <a class="navbar-brand fw-bold text-white d-flex align-items-center" href="../index.html">
      <img src="../assets/img/salud.png"
           alt="Logo Salud y Bienestar"
           class="logo-navbar">
      <span class="ms-2">Salud &amp; Bienestar</span>
    </a>

    <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link" href="perfil.html">Perfil</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="recomendaciones.html">Recomendaciones</a>
        </li>

        <li class="nav-item">
          <a class="nav-link active" href="progreso.html">Progreso</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="historial.html">Historial</a>
        </li>

      </ul>
    </div>

  </div>
</nav>

  <main class="container py-5">
    <h1 class="text-center mb-4">Seguimiento del progreso</h1>

    <section class="contenedor-formulario">
      <form id="formProgreso">
        <div class="row">
          <div class="col-md-4 mb-3">
            <label for="pesoActual" class="form-label">Peso actual (kg)</label>
            <input type="number" class="form-control" id="pesoActual" placeholder="Ejemplo: 68">
            <div class="text-danger small" id="errorPesoActual"></div>
          </div>

          <div class="col-md-4 mb-3">
            <label for="suenoActual" class="form-label">Horas de sueño</label>
            <input type="number" class="form-control" id="suenoActual" placeholder="Ejemplo: 7">
            <div class="text-danger small" id="errorSuenoActual"></div>
          </div>

          <div class="col-md-4 mb-3">
            <label for="actividadRealizada" class="form-label">Actividad realizada</label>
            <input type="text" class="form-control" id="actividadRealizada" placeholder="Ejemplo: Caminata 30 min">
            <div class="text-danger small" id="errorActividadRealizada"></div>
          </div>
        </div>

        <div class="text-center mt-3">
          <button type="submit" class="btn btn-principal">Guardar progreso</button>
        </div>
      </form>
    </section>

    <section class="mt-5">
      <div class="tarjeta-info">
        <h3 class="titulo-tarjeta">Resumen semanal</h3>
        <p><strong>Peso:</strong> <span id="resumenPeso">Sin registro</span></p>
        <p><strong>Sueño promedio:</strong> <span id="resumenSueno">Sin registro</span></p>
        <p><strong>Actividad destacada:</strong> <span id="resumenActividad">Sin registro</span></p>
      </div>
    </section>

    <section class="mt-4">
      <div class="tarjeta-info mb-4">
        <h3 class="titulo-tarjeta">Evolución del peso</h3>
        <canvas id="graficaPeso" height="110"></canvas>
      </div>

      <div class="tarjeta-info">
        <h3 class="titulo-tarjeta">Evolución del sueño</h3>
        <canvas id="graficaSueno" height="110"></canvas>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/pages/progreso.js"></script>
</body>
</html>
