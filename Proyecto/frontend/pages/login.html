<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Iniciar sesión</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link href="../css/styles.css" rel="stylesheet">
  <link href="../css/components.css" rel="stylesheet">
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-personalizada shadow-sm">
    <div class="container">

      <a
        class="navbar-brand fw-bold text-white d-flex align-items-center"
        href="../index.html"
      >
        <img
          src="../assets/img/salud.png"
          alt="Logo Salud y Bienestar"
          class="logo-navbar"
        >

        <span class="ms-2">Salud &amp; Bienestar</span>
      </a>

      <div class="ms-auto">
        <a class="nav-link d-inline-block" href="registro.html">
          Registrarse
        </a>
      </div>

    </div>
  </nav>

  <main class="pantalla-acceso">
    <div class="container">

      <section class="contenedor-formulario contenedor-acceso">

        <div class="text-center mb-4">
          <img
            src="../assets/img/salud.png"
            alt="Salud y Bienestar"
            class="logo-acceso mb-3"
          >

          <h1>Iniciar sesión</h1>

          <p class="text-muted mb-0">
            Accede para continuar con tu seguimiento de bienestar.
          </p>
        </div>

        <form id="formLogin">

          <div class="mb-3">
            <label for="correo" class="form-label">
              Correo electrónico
            </label>

            <input
              type="email"
              class="form-control"
              id="correo"
              placeholder="ejemplo@correo.com"
              required
            >
          </div>

          <div class="mb-4">
            <label for="contrasena" class="form-label">
              Contraseña
            </label>

            <input
              type="password"
              class="form-control"
              id="contrasena"
              placeholder="Ingrese su contraseña"
              required
            >
          </div>

          <button type="submit" class="btn btn-principal">
            Iniciar sesión
          </button>

        </form>

        <p class="enlace-acceso">
          ¿No tienes una cuenta?
          <a href="registro.html">Registrarse</a>
        </p>

      </section>

    </div>
  </main>

  <script src="../js/services/api.js"></script>
  <script src="../js/utils/notificaciones.js"></script>
  <script src="../js/pages/login.js"></script>

</body>
</html>
